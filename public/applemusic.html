<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apple Music · Streamover</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f7; --fg: #111; --muted: #666; --card: #fff; --line: rgba(0, 0, 0, 0.1); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #111; --fg: #f5f5f5; --muted: #aaa; --card: #1c1c1e; --line: rgba(255, 255, 255, 0.12); }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; }
    button { height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: #111; color: #fff; font-weight: 700; cursor: pointer; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button { background: #fff; color: #111; } }
    button:disabled { opacity: 0.4; cursor: default; }
    #now { font-weight: 700; margin-top: 14px; }
    #error { color: #d00; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Apple Music untuk Streamover</h1>
      <p>Halaman ini mengirim lagu yang sedang diputar ke Streamover. Biarkan tab ini terbuka selama siaran, dan putar lagu di Apple Music pada tab yang sama. Buka halaman ini setelah login ke panel Streamover.</p>
      <button id="connect" type="button" disabled>Hubungkan Apple Music</button>
      <div id="now">Belum ada lagu</div>
      <p id="status"></p>
      <p id="error" role="alert"></p>
    </div>
  </main>
  <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" data-web-components async></script>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const show = (id, text) => { $(id).textContent = text; };
    let music = null;
    let timer = null;

    // The token comes from the server, which keeps the private key. Only a logged-in panel gets one.
    async function loadToken() {
      const res = await fetch('/api/applemusic/token', { credentials: 'same-origin' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Gagal mengambil token (HTTP ${res.status}). Pastikan sudah login ke panel.`);
      return data.token;
    }

    // MusicKit JS loads on its own. Wait for it if it is not there yet.
    function musicKitReady() {
      if (window.MusicKit) return Promise.resolve();
      return new Promise((resolve) => document.addEventListener('musickitloaded', resolve, { once: true }));
    }

    async function report() {
      if (!music) return;
      const item = music.nowPlayingItem;
      const attrs = item?.attributes || {};
      const body = item
        ? {
          songId: item.id || '',
          title: attrs.name || '',
          artist: attrs.artistName || '',
          image: attrs.artwork?.url?.replace('{w}', '300').replace('{h}', '300') || '',
          playing: music.playbackState === MusicKit.PlaybackStates.playing,
          currentTime: music.currentPlaybackTime || 0,
          duration: music.currentPlaybackDuration || (attrs.durationInMillis || 0) / 1000,
        }
        : { title: '', artist: '', playing: false };
      show('now', body.title ? `${body.title} — ${body.artist}` : 'Belum ada lagu');
      await fetch('/api/applemusic/report', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).catch(() => {});
    }

    function startReporting() {
      show('status', 'Terhubung. Lagu dikirim setiap 2 detik.');
      report();
      clearInterval(timer);
      timer = setInterval(report, 2000);
    }

    try {
      const token = await loadToken();
      await musicKitReady();
      await MusicKit.configure({ developerToken: token, app: { name: 'Streamover', build: '1.0.0' } });
      music = MusicKit.getInstance();
      music.addEventListener('playbackStateDidChange', report);
      music.addEventListener('nowPlayingItemDidChange', report);
      $('connect').disabled = false;
      if (music.isAuthorized) startReporting();
      else show('status', 'Klik tombol untuk login ke Apple Music.');
    } catch (err) {
      show('error', err.message);
    }

    $('connect').addEventListener('click', async () => {
      try {
        await music.authorize();
        startReporting();
      } catch (err) {
        show('error', err.message);
      }
    });
  </script>
</body>
</html>
