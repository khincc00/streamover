<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soundboard</title>
  <style>
    /* Tidak ada tampilan. Overlay ini hanya memutar suara dari panel Soundboard. */
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script type="module">
    import { connectHub } from '/shared/ws.js';

    // The overlay key from the link lets the sound files load without a login.
    const key = new URLSearchParams(location.search).get('key') || '';
    // Sounds that are still playing, so "stop" can end all of them.
    const playing = new Set();

    function play(slot, volume) {
      const audio = new Audio(`/api/soundboard/file/${slot}${key ? `?key=${encodeURIComponent(key)}` : ''}`);
      const level = Number(volume);
      audio.volume = Number.isFinite(level) ? Math.min(1, Math.max(0, level)) : 1;
      const done = () => playing.delete(audio);
      audio.addEventListener('ended', done);
      audio.addEventListener('error', done);
      playing.add(audio);
      // Browsers may refuse to play without a click. The overlay only tries; it does not show an error.
      audio.play().catch(done);
    }

    function stopAll() {
      for (const audio of playing) {
        audio.pause();
        audio.removeAttribute('src');
      }
      playing.clear();
    }

    connectHub((msg) => {
      if (msg.type === 'sound') play(msg.slot, msg.volume);
      else if (msg.type === 'sound-stop') stopAll();
    });
  </script>
</body>
</html>
