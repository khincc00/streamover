<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay Lagu</title>
  <link rel="stylesheet" href="/overlay/nowplaying-templates.css">
  <style>
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }
    [hidden] { display: none !important; }
    /* The stage spans the canvas, so the box can sit left, centre, or right without fighting the perspective transform. */
    #stage {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 40px;
      display: flex;
      padding: 0 40px;
      box-sizing: border-box;
    }
    #stage.align-left { justify-content: flex-start; }
    #stage.align-center { justify-content: center; }
    #stage.align-right { justify-content: flex-end; }
    #box {
      display: none;
      width: max-content;
      max-width: 560px;
    }
    #box.show { display: flex; }
    /* Fixed size: the box keeps the width from the panel, and the text shrinks to fit it. */
    #box.fit-fixed {
      width: var(--np-width, 560px);
      max-width: none;
    }
    #box .info { min-width: 0; }
    #box.fit-fixed .info { flex: 1; }
    /* Fixed size keeps each line in place; "sesuai lagu" lets long titles wrap onto more lines. */
    #box.fit-fixed #title,
    #box.fit-fixed #artist {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #box.text-left .info { text-align: left; }
    #box.text-center .info { text-align: center; }
    #box.text-right .info { text-align: right; }
  </style>
</head>
<body>
  <div id="stage" class="align-left">
    <div id="box" class="np np-classic">
      <img id="art" class="art" alt="" hidden>
      <div class="info">
        <div id="state" class="state"></div>
        <div id="title" class="title"></div>
        <div id="artist" class="artist"></div>
      </div>
    </div>
  </div>
  <script type="module">
    import { connectHub } from '/shared/ws.js';
    import { DEFAULT_NOWPLAYING_TEMPLATE, isNowPlayingTemplate } from '/shared/nowplayingTemplates.js';
    import { applyPerspective, perspectiveFromParams } from '/shared/perspective.js';

    const params = new URLSearchParams(location.search);
    const template = isNowPlayingTemplate(params.get('template')) ? params.get('template') : DEFAULT_NOWPLAYING_TEMPLATE;
    // Spotify is the default, so links made before YouTube Music had its own overlay keep working.
    const source = params.get('source') === 'youtube' ? 'youtube' : 'spotify';
    // Size and alignment. Anything unknown falls back to the defaults the panel uses.
    const fixed = params.get('fit') === 'fixed';
    const align = ['left', 'center', 'right'].includes(params.get('align')) ? params.get('align') : 'left';
    const width = Math.min(1000, Math.max(300, Number(params.get('width')) || 560));

    const stage = document.getElementById('stage');
    const box = document.getElementById('box');
    const art = document.getElementById('art');
    const state = document.getElementById('state');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');

    stage.classList.add(`align-${align}`);
    box.className = `np np-${template}`;
    box.classList.add(fixed ? 'fit-fixed' : 'fit-content', `text-${align}`);
    box.style.setProperty('--np-width', `${width}px`);
    applyPerspective(box, perspectiveFromParams(params));

    // In fixed size the title and artist get smaller until they fit, down to half their size.
    // Anything still too long is cut off with an ellipsis.
    function fitText() {
      for (const el of [title, artist]) {
        el.style.fontSize = '';
        if (!fixed) continue;
        const base = parseFloat(getComputedStyle(el).fontSize);
        let size = base;
        while (el.scrollWidth > el.clientWidth && size > base * 0.5) {
          size -= 1;
          el.style.fontSize = `${size}px`;
        }
      }
    }

    function render(track) {
      if (!track) {
        box.classList.remove('show');
        return;
      }
      state.textContent = track.playing ? '♪ Sedang diputar' : '❚❚ Dijeda';
      state.classList.toggle('paused', !track.playing);
      box.classList.toggle('playing', Boolean(track.playing));
      // textContent (not innerHTML) so track names can't inject markup.
      title.textContent = track.title;
      artist.textContent = track.artist;
      // Only set the image when it changes, so the cover doesn't reload every poll.
      if (track.image && art.dataset.src !== track.image) {
        art.dataset.src = track.image;
        art.src = track.image;
      }
      art.hidden = !track.image;
      box.classList.add('show');
      // Measured only once the box is shown, because a hidden box has no width to measure.
      fitText();
    }

    connectHub((msg) => {
      if (msg.type !== 'nowplaying' || msg.source !== source) return;
      render(msg.nowPlaying);
    });
  </script>
</body>
</html>
