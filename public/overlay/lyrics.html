<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay Lirik</title>
  <!-- RUNNING_TEXT_FONTS_URL harus sama dengan link di index.html dan overlay/running-text.html. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mr+Dafoe:wght@400&family=Pacifico:wght@400&family=Lobster:wght@400&family=Dancing+Script:wght@700&family=Bebas+Neue:wght@400&family=Anton:wght@400&family=Bangers:wght@400&family=Righteous:wght@400&family=Playfair+Display:wght@800&family=Montserrat:wght@800&display=swap">
  <style>
    /* Font, warna, dan teks diatur dari URL (lihat script di bawah). Nilai di sini adalah bawaan. */
    :root {
      --size: 56px;
      --lyrics-color: #ffffff;
      --lyrics-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      --lyrics-weight: 800;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    [hidden] { display: none !important; }
    /* Lines fade out at the top and bottom edges, so only the middle of the list is fully visible. */
    #view {
      position: absolute;
      inset: 0;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(transparent, #000 24%, #000 76%, transparent);
      mask-image: linear-gradient(transparent, #000 24%, #000 76%, transparent);
    }
    /* The list moves so the current line stays in the middle. Top is 0, and the transform does the rest. */
    #lines {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 0 64px;
      box-sizing: border-box;
      text-align: center;
      font-family: var(--lyrics-family);
      transition: transform 500ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    #lines.jump { transition: none; }
    .line {
      font-size: var(--size);
      font-weight: var(--lyrics-weight);
      line-height: 1.3;
      padding: 0.2em 0;
      color: var(--lyrics-color);
      opacity: 0.28;
      overflow-wrap: anywhere;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.55));
      transition: opacity 300ms, transform 300ms;
    }
    .line.near { opacity: 0.6; }
    .line.active { opacity: 1; transform: scale(1.04); }
    /* The shimmer is a moving highlight behind the text, clipped to the letters. */
    .line.active > span {
      background-image: linear-gradient(100deg, color-mix(in srgb, var(--lyrics-color) 75%, #000) 40%, var(--lyrics-color) 50%, color-mix(in srgb, var(--lyrics-color) 75%, #000) 60%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 3s linear infinite;
    }
    #lines.paused .line.active > span { animation-play-state: paused; }
    @keyframes shimmer {
      from { background-position: 100% 0; }
      to { background-position: -100% 0; }
    }
    #status {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      padding: 0 64px;
      box-sizing: border-box;
      text-align: center;
      font-family: var(--lyrics-family);
      font-size: calc(var(--size) * 0.5);
      font-weight: var(--lyrics-weight);
      line-height: 1.3;
      color: var(--lyrics-color);
      opacity: 0.7;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.55));
    }
  </style>
</head>
<body>
  <div id="view">
    <div id="lines"></div>
  </div>
  <div id="status" hidden></div>
  <script type="module">
    import { connectHub } from '/shared/ws.js';
    import { isRunningTextFont, runningTextFontStyle } from '/shared/runningTextTemplates.js';
    import { applyPerspective, perspectiveFromParams } from '/shared/perspective.js';

    const params = new URLSearchParams(location.search);
    // Which music source to show: Spotify by default, or ?source=youtube or ?source=applemusic.
    const source = ['youtube', 'applemusic'].includes(params.get('source')) ? params.get('source') : 'spotify';
    const root = document.documentElement.style;
    // Size in px for the current line. Anything out of range falls back to the default.
    const size = Math.min(160, Math.max(24, Number(params.get('size')) || 56));
    // Sync offset in ms, the same as the README's sync offset: positive shows lines later, negative earlier.
    const offsetMs = Math.min(10000, Math.max(-10000, Number(params.get('offset')) || 0));
    root.setProperty('--size', `${size}px`);

    // Font id from the panel. 'default' keeps the system font, so the style is null and nothing changes.
    const fontStyle = isRunningTextFont(params.get('font')) ? runningTextFontStyle(params.get('font')) : null;
    if (fontStyle) {
      root.setProperty('--lyrics-family', fontStyle.fontFamily);
      root.setProperty('--lyrics-weight', fontStyle.fontWeight);
    }
    // Text colour as 6 hex digits without '#', the same as the chat overlay's accent. Anything else keeps white.
    const color = params.get('color') || '';
    if (/^[0-9a-f]{6}$/i.test(color)) root.setProperty('--lyrics-color', `#${color}`);

    const view = document.getElementById('view');
    const lines = document.getElementById('lines');
    const status = document.getElementById('status');
    // Tilt from the panel, the same as the other overlays (rx, ry, pd). Flat when there is no tilt.
    applyPerspective(view, perspectiveFromParams(params));

    let track = null; // { key, playing, progressMs, at } from the latest nowplaying message. at is when it arrived.
    let lyrics = null; // { key, lines } from the latest lyrics message. lines is null while LRCLIB is still answering.
    let rendered = ''; // key of the song whose lines are on screen
    let active = -2; // index of the highlighted line, -2 before anything has been placed
    let jump = false; // the next placement skips the scroll animation, for a new song

    // Where the song is now, in seconds. Between polls it moves on by itself while playing.
    function positionSeconds(now) {
      const elapsed = track.playing ? now - track.at : 0;
      return (track.progressMs + elapsed - offsetMs) / 1000;
    }

    function showStatus(text) {
      lines.replaceChildren();
      lines.style.transform = '';
      rendered = '';
      active = -2;
      status.textContent = text;
      status.hidden = !text;
    }

    function build() {
      lines.replaceChildren(...lyrics.lines.map((line) => {
        const el = document.createElement('div');
        el.className = 'line';
        const span = document.createElement('span');
        // A blank line is an instrumental break, shown as a note.
        // textContent (not innerHTML) so lyrics can't inject markup.
        span.textContent = line.text || '♪';
        el.append(span);
        return el;
      }));
      rendered = lyrics.key;
      active = -2;
      jump = true;
    }

    function place(index) {
      const children = lines.children;
      for (let i = 0; i < children.length; i++) {
        children[i].classList.toggle('active', i === index);
        children[i].classList.toggle('near', Math.abs(i - index) === 1);
      }
      // With no line reached yet, the list stays centred on the first line.
      const focus = children[Math.max(index, 0)];
      const centre = focus.offsetTop + focus.offsetHeight / 2;
      if (jump) lines.classList.add('jump');
      lines.style.transform = `translateY(${view.clientHeight / 2 - centre}px)`;
      if (jump) {
        // Reading offsetHeight makes the browser apply the position before the transition comes back.
        void lines.offsetHeight;
        lines.classList.remove('jump');
        jump = false;
      }
      active = index;
    }

    // Shows the lines for the song that is playing. Lyrics for another song are never shown.
    function render() {
      if (!track) return showStatus('');
      if (!lyrics || lyrics.key !== track.key) return showStatus('Mencari lirik…');
      if (lyrics.lines === null) return showStatus('Mencari lirik…');
      if (lyrics.lines.length === 0) return showStatus('Lirik tidak tersedia untuk lagu ini');
      if (rendered !== lyrics.uri) build();
      status.hidden = true;
      lines.classList.toggle('paused', !track.playing);
      update();
    }

    function update() {
      if (!track || !lyrics || rendered !== track.key || !lyrics.lines?.length) return;
      const pos = positionSeconds(performance.now());
      const all = lyrics.lines;
      let index = -1;
      while (index + 1 < all.length && all[index + 1].time <= pos) index += 1;
      if (index !== active) place(index);
    }

    // Runs every frame. It only changes the page when the highlighted line moves.
    function frame() {
      update();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    connectHub((msg) => {
      if (msg.source !== source) return;
      if (msg.type === 'nowplaying') {
        const np = msg.nowPlaying;
        track = np ? { key: np.key || '', playing: np.playing, progressMs: np.progressMs || 0, at: performance.now() } : null;
        render();
      } else if (msg.type === 'lyrics') {
        lyrics = { key: msg.key, lines: msg.lines };
        render();
      }
    });
  </script>
</body>
</html>
